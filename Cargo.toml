[package]
name = "rstree"
version = "0.1.0"
edition = "2024"

[dependencies]
colored = "2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
unicode-width = "0.2"
phf = { version = "0.11", features = ["macros"] }
strip-ansi-escapes = "0.2"

[dev-dependencies]
rstest = "0.24"
tempfile = "3"
